<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Eksekutif | BPJS Mystery Shopper</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { border-radius: 16px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .sidebar { background: #0D6EFD; color: white; min-height: 100vh; }
        .chart-card { height: 350px; }
        h5 { font-weight: 600; color: #334155; }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #0D6EFD !important; color: white !important; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Executive Mystery Shopper Dashboard</h2>
            <p class="text-muted">Monitoring Performa Kantor Cabang BPJS Kesehatan</p>
        </div>
        <select id="filterRegional" class="form-select w-25" onchange="filterData()">
            <option value="All">Lihat Semua Regional</option>
        </select>
    </div>

    <!-- KPI Section -->
    <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="card p-4 text-center"><h6>Skor Nasional</h6><h3 id="statSkor">0</h3></div></div>
        <div class="col-md-3"><div class="card p-4 text-center"><h6>Total Temuan Critical</h6><h3 id="statCrit" class="text-danger">0</h3></div></div>
    </div>

    <!-- Charts Section -->
    <div class="row g-4 mb-4">
        <div class="col-md-7"><div class="card p-4 chart-card"><h5>Performa per Regional</h5><canvas id="barChart"></canvas></div></div>
        <div class="col-md-5"><div class="card p-4 chart-card"><h5>Distribusi Predikat</h5><canvas id="pieChart"></canvas></div></div>
    </div>

    <!-- Table Section -->
    <div class="card p-4">
        <h5 class="mb-3">Detail Per Kantor Cabang</h5>
        <table id="tableKC" class="table table-hover">
            <thead><tr><th>KC</th><th>Regional</th><th>Total Score</th><th>Predikat</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    let allData = [];
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNfJvpmBizigPToxJkwKnvyR0304-7Iy2QkrgRZ-XG6SoQNbJYZdHE5POO3CaE9SiiFsUxFpRRHKl1/pub?output=csv';

    Papa.parse(SHEET_URL, {
        download: true, header: true, dynamicTyping: true,
        complete: (results) => {
            allData = results.data;
            const regionals = [...new Set(allData.map(x => x.Regional))];
            regionals.forEach(r => $('#filterRegional').append(`<option value="${r}">${r}</option>`));
            updateDashboard(allData);
        }
    });

    function updateDashboard(data) {
        // Update Stats
        const avg = (data.reduce((a,b) => a + b['Total Score'], 0) / data.length).toFixed(1);
        const crit = data.reduce((a,b) => a + b['Jumlah Temuan Critical'], 0);
        $('#statSkor').text(avg); $('#statCrit').text(crit);

        // Update Charts
        if(window.bChart) window.bChart.destroy();
        const regLabels = [...new Set(data.map(x => x.Regional))];
        window.bChart = new Chart($('#barChart'), {
            type: 'bar',
            data: { labels: regLabels, datasets: [{ label: 'Rata-rata Skor', data: regLabels.map(r => data.filter(x => x.Regional === r).reduce((a,b) => a + b['Total Score'], 0) / data.filter(x => x.Regional === r).length), backgroundColor: '#0D6EFD' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Update Table
        const table = $('#tableKC').DataTable();
        table.clear();
        data.forEach(x => table.row.add([x.KC, x.Regional, x['Total Score'], x.Predikat]));
        table.draw();
    }

    function filterData() {
        const val = $('#filterRegional').val();
        updateDashboard(val === 'All' ? allData : allData.filter(x => x.Regional === val));
    }
</script>
</body>
</html>
