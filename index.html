<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Executive Mystery Shopper Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        body { background: #e0e6ed; font-family: 'Segoe UI', sans-serif; }
        .dashboard-header { background: #1a2a6c; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .kpi-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .card-custom { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .leaderboard-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <div class="dashboard-header d-flex justify-content-between align-items-center">
            <h2>Monitoring Performa Mystery Shopper</h2>
            <div class="d-flex gap-2">
                <select id="fReg" class="form-select" onchange="updateDash()"><option value="All">Regional</option></select>
                <select id="fPul" class="form-select" onchange="updateDash()"><option value="All">Pulau</option></select>
            </div>
        </div>

        <!-- KPI Section -->
        <div class="row mb-4">
            <div class="col-md-4"><div class="kpi-box"><h5>Skor Satpam</h5><h2 id="kpiSat" class="text-primary">0</h2></div></div>
            <div class="col-md-4"><div class="kpi-box"><h5>Skor Informasi</h5><h2 id="kpiInf" class="text-primary">0</h2></div></div>
            <div class="col-md-4"><div class="kpi-box"><h5>Skor Pengaduan</h5><h2 id="kpiAdu" class="text-primary">0</h2></div></div>
        </div>

        <div class="row">
            <!-- Chart Section -->
            <div class="col-lg-8">
                <div class="card-custom"><h5>Tren Skor Semester</h5><canvas id="lineChart" height="150"></canvas></div>
            </div>
            <!-- Leaderboard Section -->
            <div class="col-lg-4">
                <div class="card-custom"><h5>Shopper Performa Terbaik</h5><div id="leaderboard"></div></div>
            </div>
        </div>
    </div>

    <script>
        let data = [];
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNfJvpmBizigPToxJkwKnvyR0304-7Iy2QkrgRZ-XG6SoQNbJYZdHE5POO3CaE9SiiFsUxFpRRHKl1/pub?output=csv';

        Papa.parse(URL, { download: true, header: true, dynamicTyping: true, complete: (res) => {
            data = res.data;
            ['Regional', 'Pulau'].forEach(f => [...new Set(data.map(x=>x[f]))].filter(Boolean).forEach(v => $(`#f${f.substring(0,3)}`).append(`<option value="${v}">${v}</option>`)));
            updateDash();
        }});

        function updateDash() {
            const d = data.filter(x => ($('#fReg').val() === 'All' || x.Regional === $('#fReg').val()) && ($('#fPul').val() === 'All' || x.Pulau === $('#fPul').val()));
            
            // KPI Update
            $('#kpiSat').text((d.reduce((a,b)=>a+b['Nilai Satpam'],0)/d.length).toFixed(1));
            $('#kpiInf').text((d.reduce((a,b)=>a+b['Nilai Pelayanan Informasi'],0)/d.length).toFixed(1));
            $('#kpiAdu').text((d.reduce((a,b)=>a+b['Nilai Penanganan Pengaduan'],0)/d.length).toFixed(1));

            // Chart
            if(window.lChart) window.lChart.destroy();
            window.lChart = new Chart(document.getElementById('lineChart'), {
                type: 'line', data: { labels: ['Smt 1', 'Smt 2'], datasets: [{ label: 'Total Score', data: [d.filter(x=>x.Semester=='Semester 1').reduce((a,b)=>a+b['Total Score'],0)/d.filter(x=>x.Semester=='Semester 1').length, d.filter(x=>x.Semester=='Semester 2').reduce((a,b)=>a+b['Total Score'],0)/d.filter(x=>x.Semester=='Semester 2').length], borderColor: '#1a2a6c', tension: 0.4, fill: true, backgroundColor: 'rgba(26, 42, 108, 0.1)' }] }
            });

            // Leaderboard (Shopper)
            $('#leaderboard').empty();
            const top = [...d].sort((a,b)=>b['Total Score']-a['Total Score']).slice(0,5);
            top.forEach(row => $('#leaderboard').append(`<div class="leaderboard-item"><span>${row.KC}</span><b>${row['Total Score']}</b></div>`));
        }
    </script>
</body>
</html>
