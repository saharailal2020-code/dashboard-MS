<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard BPJS Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">

    <div class="container">
        <h2 class="mb-4">Dashboard Monitoring Mystery Shopper</h2>
        <div id="status" class="alert alert-info">Memproses data...</div>
        <div id="dashboard-content">
            <div class="card p-4 mb-4">
                <canvas id="myChart" height="100"></canvas>
            </div>
            <div class="card p-4">
                <table id="tabelData" class="table"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNfJvpmBizigPToxJkwKnvyR0304-7Iy2QkrgRZ-XG6SoQNbJYZdHE5POO3CaE9SiiFsUxFpRRHKl1/pub?output=csv';

        Papa.parse(SHEET_URL, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                const data = results.data;
                const keys = Object.keys(data[0]); // Mengambil nama kolom asli dari sheet
                
                document.getElementById('status').style.display = 'none';

                // Render Chart (Menggunakan kolom ke-2 untuk Label, kolom ke-13 untuk Skor)
                new Chart(document.getElementById('myChart'), {
                    type: 'bar',
                    data: {
                        labels: data.map(x => x[keys[1]]),
                        datasets: [{ label: 'Score', data: data.map(x => x[keys[12]]), backgroundColor: '#0D6EFD' }]
                    }
                });

                // Render Tabel
                keys.forEach(k => $('#tableHead').append(`<th>${k}</th>`));
                data.forEach(row => {
                    let tr = '<tr>';
                    keys.forEach(k => tr += `<td>${row[k]}</td>`);
                    $('#tableBody').append(tr + '</tr>');
                });
            }
        });
    </script>
</body>
</html>
