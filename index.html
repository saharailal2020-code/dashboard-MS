<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Currency Quality Insights Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root { --navy: #0a2540; --emerald: #007d69; --soft-blue: #e6f0ff; --orange: #f47920; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: var(--navy); min-height: 100vh; color: white; padding: 20px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
        .nav-link { color: #ccc; }
        .nav-link.active { color: white; font-weight: bold; }
        .chart-container { position: relative; height: 300px; }
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="loader"><div class="spinner-border text-primary" role="status"></div></div>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar">
            <h4><i class="fa fa-chart-line"></i> BI Insights</h4>
            <hr>
            <div id="filters">
                <label>Wilayah</label>
                <select class="form-select mb-3" id="filterWilayah"><option>Nasional</option><option>3T</option></select>
                <label>Jenis Responden</label>
                <select class="form-select mb-3" id="filterResponden"><option>Total</option><option>Ruta</option><option>UMKM</option></select>
            </div>
            <button class="btn btn-outline-light w-100 mt-3" onclick="resetDashboard()">Reset Filter</button>
        </nav>

        <main class="col-md-10 p-4">
            <header class="mb-4">
                <h2 class="text-navy">Executive Summary</h2>
                <p id="autoNarrative" class="text-muted italic">Memuat analisis data otomatis...</p>
            </header>

            <div class="row" id="kpiContainer">
                </div>

            <div class="row mt-4">
                <div class="col-md-8"><div class="card p-3"><canvas id="mainChart"></canvas></div></div>
                <div class="col-md-4"><div class="card p-3"><div id="radarChart"></div></div></div>
            </div>

            <div class="card mt-4 p-3">
                <table id="dataTable" class="table table-hover"></table>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script>
    const DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTWLqTAMB2GBdL6qNMVBS8udxSiZdbstHoRxLWSjQxWmPMMZwb1Hp2-VX1OUm0V5rHumvj2WjL9UVuL/pub?output=csv";

    async function loadData() {
        Papa.parse(DATA_URL, {
            download: true,
            header: true,
            complete: function(results) {
                processDashboard(results.data);
                $('.loader').fadeOut();
            }
        });
    }

    function processDashboard(data) {
        // Logika agregasi data nasional (Simulasi)
        const totalPersepsi = data.reduce((acc, curr) => acc + parseFloat(curr.Persepsi || 0), 0) / data.length;
        
        // Update Narrative
        document.getElementById('autoNarrative').innerText = `Secara nasional, indeks persepsi layak edar berada di angka ${totalPersepsi.toFixed(2)}. Kualitas uang Rupiah memperlihatkan tren stabilitas.`;
        
        // Render Chart Contoh
        new Chart(document.getElementById('mainChart'), {
            type: 'bar',
            data: {
                labels: ['100rb', '50rb', '20rb', '10rb', '5rb', '2rb', '1rb'],
                datasets: [{ label: 'IKU', data: [85, 82, 78, 75, 70, 65, 60], backgroundColor: '#007d69' }]
            }
        });
    }

    $(document).ready(loadData);
</script>
</body>
</html>
