<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard BPJS</title>
    <!-- Library -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="status">Memuat data...</div>

    <script>
        // GANTI URL DISINI DENGAN URL YANG TADI ANDA COBA
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNfJvpmBizigPToxJkwKnvyR0304-7Iy2QkrgRZ-XG6SoQNbJYZdHE5POO3CaE9SiiFsUxFpRRHKl1/pub?output=csv';

        Papa.parse(SHEET_URL, {
            download: true,
            header: true,
            complete: function(results) {
                console.log("Data berhasil dimuat:", results.data);
                document.getElementById('status').innerHTML = "Data berhasil dimuat! Jumlah baris: " + results.data.length;
                // Jika muncul tulisan ini, berarti masalah utama sudah teratasi.
            },
            error: function(err) {
                document.getElementById('status').innerHTML = "Error: " + err;
                console.error("Detail Error:", err);
            }
        });
    </script>
</body>
</html>
