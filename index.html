<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Mystery Shopper BPJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">

    <div class="container">
        <h2 class="mb-4">Dashboard Monitoring Mystery Shopper</h2>
        
        <div id="status" class="alert alert-info">Memuat data dan grafik...</div>
        
        <div id="dashboard-content" style="display:none;">
            <div class="card p-4">
                <h5>Grafik Skor Kantor Cabang</h5>
                <canvas id="myChart" height="100"></canvas>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNfJvpmBizigPToxJkwKnvyR0304-7Iy2QkrgRZ-XG6SoQNbJYZdHE5POO3CaE9SiiFsUxFpRRHKl1/pub?output=csv';

        Papa.parse(SHEET_URL, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                const data = results.data;
                
                // Sembunyikan status, tampilkan konten
                document.getElementById('status').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';

                // Siapkan data untuk Chart.js
                const labels = data.map(x => x.KC);
                const scores = data.map(x => x['Total Score']);

                // Render Chart
                new Chart(document.getElementById('myChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Total Score per KC',
                            data: scores,
                            backgroundColor: '#0D6EFD'
                        }]
                    }
                });
            },
            error: function(err) {
                document.getElementById('status').className = "alert alert-danger";
                document.getElementById('status').innerHTML = "Error: " + err;
            }
        });
    </script>
</body>
</html>
